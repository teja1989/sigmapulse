name: Deploy SigmaPulse to Google Cloud Run

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: quantum-pulsar
  SERVICE_NAME: sigmapulse-app
  REGION: us-central1
  GAR_LOCATION: us-central1
  REPOSITORY: sigmapulse
  IMAGE_NAME: sigmapulse-terminal

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  deploy:
    name: Build & Deploy to Google Cloud Run
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet || gcloud auth configure-docker gcr.io --quiet

      - name: Create Artifact Registry Repository if not exists
        run: |
          gcloud artifacts repositories describe ${{ env.REPOSITORY }} --location=${{ env.GAR_LOCATION }} || \
          gcloud artifacts repositories create ${{ env.REPOSITORY }} --repository-format=docker --location=${{ env.GAR_LOCATION }} --description="SigmaPulse Terminal Docker Images" || true

      - name: Build Docker Container
        run: |
          docker build \
            -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push Docker Image to Artifact Registry
        run: |
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Google Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          flags: |
            --allow-unauthenticated
            --port=3000
            --min-instances=0
            --max-instances=5
            --memory=1Gi
            --cpu=1
            --timeout=300
            --cpu-boost

      - name: Print Live Service URL
        run: |
          echo "SigmaPulse deployed: ${{ steps.deploy.outputs.url }}"

      - name: Smoke routes
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          for path in / /options /news /desk /ticker/AAPL; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "$URL$path")
            echo "$path $code"
            test "$code" = "200"
          done
